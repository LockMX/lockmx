# Actions are pinned to commit SHAs (tags are mutable). The comment is the tag the SHA was taken from;
# for annotated tags (pnpm/setup) the SHA is the tagged commit, not the tag object.
# Update with: git ls-remote https://github.com/<owner>/<repo>.git "refs/tags/<tag>^{}" "refs/tags/<tag>"
# Sources:
# https://github.com/actions/setup-node (node-version-file)
# https://github.com/pnpm/setup (pnpm 11 and later, reads packageManager)
# https://playwright.dev/docs/ci (install with --with-deps; caching browser binaries is not recommended)
# https://playwright.dev/docs/ci-intro (report uploaded as an artifact)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Public origin the pages are built with (apps/web/.env.example). Not a secret.
      SITE_URL: https://lockmx.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps
      - run: pnpm test:e2e
        # A hung run fails here, so the report below is still uploaded.
        timeout-minutes: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
