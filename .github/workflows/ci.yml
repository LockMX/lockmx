# Actions are pinned to commit SHAs (tags are mutable). The comment is the tag the SHA was taken from;
# for annotated tags (pnpm/setup) the SHA is the tagged commit, not the tag object.
# Update with: git ls-remote https://github.com/<owner>/<repo>.git "refs/tags/<tag>^{}" "refs/tags/<tag>"
# Sources:
# https://github.com/actions/setup-node (node-version-file)
# https://github.com/pnpm/setup (pnpm 11 and later, reads packageManager)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
