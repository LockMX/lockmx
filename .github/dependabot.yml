# Source: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Keeps the SHA-pinned actions in .github/workflows current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Follows the commit convention in docs/workflow.md ("arch: bump ...").
    commit-message:
      prefix: arch
